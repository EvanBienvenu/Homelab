# Ubuntu 26.04 active kernel.apparmor_restrict_unprivileged_unconfined=1.
# Les conteneurs Incus avec systemd 259 restent bloqués en "initializing"
# (pas de journald, pas de networkd, donc pas d'IP).
# Correctif recommandé par Incus : https://github.com/lxc/incus/issues/3251
# A copier dans /etc/sysctl.d/ sur l'hôte Incus.
-kernel.apparmor_restrict_unprivileged_unconfined = 0
